name: Chart probe (temporary)

# Temporary helper: reads IRCTC's public reservation-chart JSON API for
# 19031 on 28 Oct 2026 so the vacancy can be seen from the sandbox.
# Delete this file (and .github/scripts/chart-probe.mjs) once done.

on:
  push:
    branches: [arena/74bee799-guwahati-run]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Query IRCTC online-charts
        run: node .github/scripts/chart-probe.mjs
      - name: Commit the result back to the branch
        run: |
          git config user.name "chart-probe"
          git config user.email "chart-probe@users.noreply.github.com"
          git add chart-probe-output.json
          git commit -m "chore: chart probe output [skip ci]" || echo "nothing to commit"
          git push

